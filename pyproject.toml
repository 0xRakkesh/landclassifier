[project]
name = "landclassifier"
version = "0.1.0"
description = "Land Classification Using Traditional Image Processing (OpenCV, K-means, FastAPI, Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pillow>=10.2.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
